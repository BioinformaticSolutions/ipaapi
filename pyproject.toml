[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipaapi"
# Single source of truth: src/ipaapi/__init__.py. Keeping the number in two
# places guarantees they drift, and a wheel whose version lies is worse than
# no version at all.
dynamic = ["version"]
description = "Command-line client for QIAGEN Ingenuity Pathway Analysis: map arbitrary column layouts, submit datasets in bulk, and resume cleanly when the analysis allowance runs out."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Kenneth L. Jones", email = "Ken.Jones@bioinformaticsolutions.com" }]
keywords = ["ipa", "ingenuity", "pathway", "bioinformatics", "qiagen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.28",
    "requests-oauthlib>=1.3",
    "pandas>=1.5",
]

[project.scripts]
ipaapi = "ipaapi.cli:main"

[project.optional-dependencies]
progress = ["tqdm>=4.64"]
dev = ["pytest>=7.0"]

[tool.hatch.version]
path = "src/ipaapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipaapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
